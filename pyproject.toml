[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bukti"
version = "0.1.0"
description = "Python client, CLI, and open protocol for Bukti — capability intelligence for people, AI agents, and organizations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Bukti contributors" },
]
keywords = ["bukti", "capability", "agent", "mcp", "a2a", "portfolio", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "respx>=0.20",
    "mkdocs-material>=9",
    "ruff>=0.5",
]

[project.scripts]
bukti = "bukti.cli:main"

[project.urls]
Homepage = "https://bukti.ai"
Documentation = "https://github.com/bukti-ai/bukti"
Issues = "https://github.com/bukti-ai/bukti/issues"
Specification = "https://github.com/bukti-ai/bukti/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["src/bukti"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
