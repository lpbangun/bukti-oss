site_name: Bukti
site_description: Python client, CLI, and open protocol for capability intelligence.
site_url: https://bukti.ai
repo_url: https://github.com/lpbangun/bukti-oss
repo_name: lpbangun/bukti-oss

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Setup: setup.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Limitations: limitations.md
  - Methodology: methodology.md
  - Specification: spec.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
